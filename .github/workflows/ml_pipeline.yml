name: ML Pipeline
on: [push]
permissions:
  contents: write
jobs:
  capstone_project:
    runs-on: ubuntu-latest
    steps:
      - name: File Checkout
        uses: actions/checkout@v3

      - name: Python setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Convert notebook to script
        run: |
          pip install nbconvert nbformat
          jupyter nbconvert --to script Srikanth_Predictive_Maintenance_InterimReport_Notebook.ipynb
          mv Srikanth_Predictive_Maintenance_InterimReport_Notebook.txt Srikanth_Predictive_Maintenance_InterimReport_Notebook.py
          jupyter nbconvert --to script app.ipynb 
          mv app.txt app.py
      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Srikanth_Predictive_Maintenance_InterimReport_Notebook.py app.py
          git commit -m "Update generated Python files" || echo "No changes to commit"
          git push
      - name: Update Model whenever there is a checkin
        run: |
          python Srikanth_Predictive_Maintenance_InterimReport_Notebook.py
          git add -f model/ artifacts/ 
          git commit -m "Update generated Python files" || echo "No changes to commit"
          git push

      - name: Validate Streamlit code is sintax error free
        run: |
          python -m py_compile app.py
        

